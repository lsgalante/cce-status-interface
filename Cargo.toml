[package]
name = "cce-status-interface"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://git.lucas.co/cce-ui.git", rev = "e933422c4efd8066f8fe1596348d9e14ae6f227e" }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
# Real dependency: stats.rs blocks on the async volume read.
pollster = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio-stream = "0.1"
zbus = "4"
resvg = "0.41.0"
png = "0.17"
log = "0.4"
env_logger = "0.11"
kdl = "4.6"
# Real dependency: PR_SET_PDEATHSIG on the `pactl subscribe` child.
libc = "0.2"









