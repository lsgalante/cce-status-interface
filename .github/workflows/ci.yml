name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors; the crate is clippy-clean (house-style allowances in
  # Cargo.toml's [lints.clippy]), so keep it so.
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A known face set for anything that shapes text (cce-ui reads it from here).
      CCE_FONTS_DIR: /usr/share/fonts/truetype/liberation
    steps:
      - uses: actions/checkout@v5
      # libwayland-dev, libxkbcommon-dev: what cce-ui links through pkg-config.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev fonts-liberation
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
